name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sast:
    name: Python SAST (Bandit & SonarQube)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit
    - name: Run Bandit
      run: bandit -r ledger-engine/

  sca:
    name: SCA (Snyk, npm audit, pip-audit)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: npm audit
      run: cd ingestion-gateway && npm install && npm audit --audit-level=high

  smart-contract:
    name: Smart Contract Analysis (Slither)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Slither
      run: pip3 install slither-analyzer
    - name: Run Slither
      run: slither smart-contracts/contracts/PocketLedgerAnchor.sol || true
